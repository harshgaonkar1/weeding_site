services:
  # ==============================================================
  # 1. Node.js Backend API & Real-time Socket.IO Service
  # Connected directly to PostgreSQL on your DigitalOcean Linux VM
  # ==============================================================
  backend:
    build:
      context: ./backend
      dockerfile: DockerFile
    container_name: wedding-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      # Persist generated Excel sheets outside the container
      - ./backend/exports:/app/exports
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==============================================================
  # 2. (Optional) Local PostgreSQL Database
  # Run only if you want a local DB container: docker compose --profile local-db up
  # ==============================================================
  db:
    image: postgres:15-alpine
    container_name: wedding-local-db
    profiles:
      - local-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      - local_pg_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================
  # 3. (Optional) Database Web GUI (Adminer)
  # Run with: docker compose --profile tools up
  # ==============================================================
  adminer:
    image: adminer:latest
    container_name: wedding-db-adminer
    profiles:
      - tools
      - local-db
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  local_pg_data:
    name: wedding_local_pg_data
