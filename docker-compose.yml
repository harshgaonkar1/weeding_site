services:
  # ==============================================================
  # 1. Node.js Backend API & Socket.IO
  # ==============================================================
  backend:
    build:
      context: ./backend
      dockerfile: DockerFile # must match the real filename exactly (case-sensitive)
    container_name: wedding-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Overrides any DB setting in backend/.env; "db" is the service name below
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./backend/exports:/app/exports
    depends_on:
      db:
        condition: service_healthy

  # ==============================================================
  # 2. PostgreSQL (data stored on the VM in ./pgdata)
  # ==============================================================
  db:
    image: postgres:17
    container_name: wedding-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432" # reachable only from the VM itself
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================
  # 3. Adminer (database web GUI)
  # ==============================================================
  adminer:
    image: adminer:latest
    container_name: wedding-db-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # reachable only from the VM itself
    depends_on:
      - db
